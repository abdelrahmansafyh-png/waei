<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لعبة السحب والتصنيف - واعي</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Tahoma,Arial,sans-serif;color:#17324d}
body{
  background:
    radial-gradient(circle at 12% 18%,rgba(255,255,255,.92) 0 8%,transparent 9%),
    radial-gradient(circle at 84% 16%,rgba(255,255,255,.7) 0 5%,transparent 6%),
    linear-gradient(180deg,#86d9ff 0%,#bdf1ff 42%,#c9f3c8 43%,#7ddc7b 100%);
}
body:before{content:"";position:fixed;inset:0;background:
  linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px) 0 0/70px 70px,
  linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px) 0 0/70px 70px;pointer-events:none}
#app{width:100vw;height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:14px;position:relative}
.header{position:relative;z-index:3;background:rgba(255,255,255,.86);border:3px solid rgba(255,255,255,.95);border-radius:28px;padding:12px 18px;text-align:center;box-shadow:0 10px 30px rgba(25,91,130,.18)}
.header h1{margin:0;font-size:clamp(22px,2.6vw,38px);color:#143553;font-weight:900}
.header p{margin:6px 0 0;font-size:clamp(14px,1.6vw,22px);font-weight:900;color:#0f7b92}
.scene{min-height:0;display:grid;grid-template-columns:minmax(190px,23vw) 1fr;gap:12px;align-items:stretch;position:relative;z-index:2}
.coachPanel{position:relative;background:rgba(255,255,255,.58);border:3px solid rgba(255,255,255,.9);border-radius:30px;overflow:hidden;box-shadow:0 12px 28px rgba(40,90,130,.18)}
.coachBubble{position:absolute;top:16px;left:10px;right:10px;background:#fff;border:3px solid #ffd166;border-radius:22px;padding:12px;text-align:center;font-weight:900;font-size:clamp(14px,1.3vw,20px);color:#17324d;box-shadow:0 8px 20px rgba(0,0,0,.1);z-index:2}
.coachBubble:after{content:"";position:absolute;bottom:-14px;right:38px;border-width:14px 12px 0 12px;border-style:solid;border-color:#ffd166 transparent transparent transparent}
#character{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);height:78%;max-width:110%;object-fit:contain;filter:drop-shadow(0 16px 18px rgba(0,0,0,.22))}
.playHint{position:absolute;bottom:12px;left:12px;right:12px;background:rgba(15,52,96,.86);color:white;border-radius:18px;padding:10px;text-align:center;font-weight:900;font-size:13px;z-index:2}
.gameArea{min-height:0;display:grid;grid-template-rows:minmax(160px,34%) 1fr;gap:12px}
.cardsArea,.groupsArea{min-height:0;background:rgba(255,255,255,.64);border:3px solid rgba(255,255,255,.95);border-radius:30px;padding:12px;box-shadow:0 12px 28px rgba(40,90,130,.16);position:relative;overflow:hidden}
.areaTitle{font-weight:900;font-size:clamp(17px,1.8vw,24px);color:#143553;text-align:center;margin-bottom:8px}
.cardsGrid{height:calc(100% - 36px);position:relative;overflow:hidden;border-radius:22px;background:rgba(255,255,255,.38)}
.groupsArea{display:grid;gap:12px;grid-template-columns:repeat(var(--group-count,2),minmax(0,1fr))}
.dropZone{border:4px dashed rgba(20,53,83,.2);border-radius:24px;padding:10px;background:rgba(255,255,255,.42);overflow:auto;transition:.18s;min-width:0}
.dropZone.over{transform:scale(1.015);background:rgba(255,209,102,.28);border-color:#ffd166}
.dropTitle{text-align:center;border-radius:18px;padding:10px;font-size:clamp(16px,1.8vw,25px);font-weight:900;color:white;text-shadow:0 2px 2px rgba(0,0,0,.18);margin-bottom:10px}
.card{position:absolute;width:clamp(150px,18vw,220px);min-height:clamp(70px,9vw,108px);background:linear-gradient(135deg,#fff,#e9fbff);border:4px solid #ffd166;border-radius:24px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-weight:900;font-size:clamp(15px,1.45vw,22px);line-height:1.25;color:#143553;cursor:grab;user-select:none;touch-action:none;box-shadow:0 12px 20px rgba(21,69,97,.18);transition:box-shadow .2s,transform .12s,opacity .2s;overflow:hidden}
.card:active{cursor:grabbing}.card.dragging{z-index:999;transform:scale(1.06) rotate(-1deg);box-shadow:0 18px 34px rgba(0,0,0,.28),0 0 0 5px rgba(255,209,102,.45)}
.card.placed{position:relative!important;left:auto!important;top:auto!important;width:100%!important;min-height:70px;cursor:default;opacity:.98;margin:0 0 9px}.card.correctCard{border-color:#22c55e!important;box-shadow:0 0 0 4px rgba(34,197,94,.2)}.card.wrongCard{border-color:#ef4444!important;box-shadow:0 0 0 4px rgba(239,68,68,.2)}
.card img{max-width:100%;max-height:74px;object-fit:contain;border-radius:14px}
.footer{display:flex;gap:10px;align-items:center;justify-content:center;position:relative;z-index:3}.feedback{flex:1;min-height:58px;background:rgba(255,255,255,.9);border:3px solid rgba(255,255,255,.95);border-radius:22px;padding:10px 14px;font-size:clamp(16px,2vw,26px);font-weight:900;text-align:center;display:flex;align-items:center;justify-content:center;color:#143553;box-shadow:0 8px 20px rgba(40,90,130,.14)}.feedback.correct{color:#16a34a}.feedback.wrong{color:#dc2626}
button{background:linear-gradient(135deg,#ffd166,#ffb703);color:#143553;border:0;border-radius:20px;padding:14px 22px;font-size:clamp(15px,1.5vw,22px);font-weight:900;cursor:pointer;box-shadow:0 9px 0 #d18a00,0 14px 22px rgba(0,0,0,.12)}button:active{transform:translateY(4px);box-shadow:0 5px 0 #d18a00,0 8px 14px rgba(0,0,0,.12)}
.doneOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(7,27,49,.86);z-index:1000;text-align:center;color:white;padding:24px}.doneBox{background:white;color:#143553;border-radius:34px;padding:34px;box-shadow:0 24px 60px rgba(0,0,0,.28);max-width:520px}.doneBox h2{font-size:clamp(34px,5vw,62px);margin:0 0 18px}
@media(max-width:880px){#app{padding:8px;gap:8px}.scene{grid-template-columns:1fr;grid-template-rows:150px 1fr}.coachPanel{display:flex;align-items:flex-end}.coachBubble{left:auto;right:130px;top:14px;width:calc(100% - 150px);font-size:14px}#character{height:140px;left:65px}.playHint{display:none}.gameArea{grid-template-rows:190px 1fr}.groupsArea{grid-template-columns:repeat(var(--group-count,2),minmax(0,1fr));gap:8px}.footer{flex-direction:column}.feedback{width:100%}button{width:100%}.card{width:145px;min-height:66px}}
</style>
</head>
<body>
<div id="app">
  <header class="header"><h1 id="title">تحميل...</h1><p id="instruction"></p></header>
  <main class="scene">
    <aside class="coachPanel"><div id="coachBubble" class="coachBubble">أنا جاهز! اسحب البطاقات للمكان الصحيح.</div><img id="character" src="images/character.png" alt="شخصية واعي"><div class="playHint">اضغط على البطاقة لسماعها 🔊</div></aside>
    <section class="gameArea"><section class="cardsArea"><div class="areaTitle">البطاقات</div><div id="cardsGrid" class="cardsGrid"></div></section><section id="groupsArea" class="groupsArea"></section></section>
  </main>
  <footer class="footer"><div id="feedback" class="feedback">اسحب البطاقات إلى الصندوق المناسب</div><button id="checkBtn" onclick="checkAnswers()">تحقق من الإجابات ✅</button></footer>
  <div id="doneOverlay" class="doneOverlay"><div class="doneBox"><h2 id="doneTitle">أحسنت 🎉</h2><button onclick="location.reload()">إعادة اللعبة</button></div></div>
</div>

<script id="embeddedGameJson" type="application/json">
{
  "title": "ضع البطاقة في مكانها الصحيح",
  "instruction": "اسحب كل بطاقة إلى الصندوق المناسب، ثم اضغط تحقق",
  "character": "images/character.png",
  "theme": {
    "background": "classroom"
  },
  "groups": [
    {
      "id": "good",
      "title": "سلوك صحيح",
      "color": "#22c55e",
      "icon": "⭐"
    },
    {
      "id": "bad",
      "title": "سلوك غير مناسب",
      "color": "#ef4444",
      "icon": "⚠️"
    }
  ],
  "cards": [
    {
      "id": "c1",
      "type": "text",
      "text": "أساعد صديقي عندما يحتاجني",
      "group": "good",
      "audio": "audio/c1.mp3"
    },
    {
      "id": "c2",
      "type": "text",
      "text": "أستمع للمعلمة بهدوء",
      "group": "good",
      "audio": "audio/c2.mp3"
    },
    {
      "id": "c3",
      "type": "text",
      "text": "أرتب ألعابي بعد الانتهاء",
      "group": "good",
      "audio": "audio/c3.mp3"
    },
    {
      "id": "c4",
      "type": "text",
      "text": "أسخر من زميلي",
      "group": "bad",
      "audio": "audio/c4.mp3"
    },
    {
      "id": "c5",
      "type": "text",
      "text": "أقاطع حديث الآخرين",
      "group": "bad",
      "audio": "audio/c5.mp3"
    },
    {
      "id": "c6",
      "type": "image",
      "text": "أترك المكان فوضويًا",
      "image": "images/mess.svg",
      "group": "bad",
      "audio": "audio/c6.mp3"
    }
  ]
}

</script>

<script>
let GAME=null,currentAudio=null,dragged=null,dragOffsetX=0,dragOffsetY=0,checked=false;
const $=id=>document.getElementById(id);
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function setFeedback(text,type){const f=$("feedback");f.className="feedback "+(type||"");f.textContent=text;$("coachBubble").textContent=text}
function playAudio(src){if(!src)return;if(currentAudio){currentAudio.pause();currentAudio.currentTime=0}currentAudio=new Audio(src);currentAudio.play().catch(()=>{})}
function cardContent(card){if((card.type==="image"||card.image)&&card.image)return `<div><img src="${card.image}" alt="${card.text||''}"><div>${card.text||''}</div></div>`;return card.text||""}
function normalizeGame(g){g.groups=Array.isArray(g.groups)?g.groups:[];g.cards=Array.isArray(g.cards)?g.cards:[];if(!g.groups.length){const ids=[...new Set(g.cards.map(c=>c.group||c.category).filter(Boolean))];g.groups=ids.map((id,i)=>({id,title:id,color:["#22c55e","#ef4444","#3b82f6","#a855f7"][i%4]}))}g.cards=g.cards.map((c,i)=>({...c,id:c.id||`card_${i}`,group:c.group||c.category||"default"}));return g}
function renderGame(){GAME=normalizeGame(GAME);$("title").textContent=GAME.title||"ضع البطاقة في مكانها الصحيح";$("instruction").textContent=GAME.instruction||GAME.question||"اسحب كل بطاقة إلى الصندوق المناسب";if(GAME.character)$("character").src=GAME.character;const groupsArea=$("groupsArea");groupsArea.style.setProperty("--group-count",Math.max(1,GAME.groups.length));groupsArea.innerHTML="";GAME.groups.forEach((g,i)=>{const zone=document.createElement("div");zone.className="dropZone";zone.dataset.group=g.id;zone.innerHTML=`<div class="dropTitle" style="background:${g.color||'#3b82f6'}">${g.icon||''} ${g.title||g.id}</div>`;groupsArea.appendChild(zone)});const grid=$("cardsGrid");grid.innerHTML="";shuffle(GAME.cards).forEach((card,i)=>{const el=document.createElement("div");el.className="card";el.dataset.id=card.id;el.dataset.group=card.group;el.innerHTML=cardContent(card);const pos=cardPosition(i,GAME.cards.length);el.style.left=pos.x+"px";el.style.top=pos.y+"px";el.addEventListener("pointerdown",startDrag);el.addEventListener("click",()=>{setFeedback(card.text||"بطاقة","");playAudio(card.audio)});grid.appendChild(el)});setTimeout(()=>document.querySelectorAll(".card").forEach(c=>{c.dataset.originalLeft=c.style.left;c.dataset.originalTop=c.style.top}),120)}
function cardPosition(i,total){const grid=$("cardsGrid");const cw=Math.min(220,Math.max(145,grid.clientWidth*.22));const w=Math.max(1,grid.clientWidth-cw-18);const h=Math.max(1,grid.clientHeight-88);const cols=Math.max(1,Math.floor(grid.clientWidth/(cw+14)));const col=i%cols,row=Math.floor(i/cols);return {x:Math.min(w,14+col*(cw+14)),y:Math.min(h,14+row*86)}}
function startDrag(e){if(checked)return;const el=e.currentTarget;if(el.classList.contains("placed"))return;dragged=el;dragged.classList.add("dragging");dragged.setPointerCapture(e.pointerId);const r=dragged.getBoundingClientRect();dragOffsetX=e.clientX-r.left;dragOffsetY=e.clientY-r.top;const card=GAME.cards.find(c=>c.id===dragged.dataset.id);setFeedback(card?.text||"بطاقة","");playAudio(card?.audio);dragged.addEventListener("pointermove",onDrag);dragged.addEventListener("pointerup",endDrag);dragged.addEventListener("pointercancel",endDrag)}
function onDrag(e){if(!dragged)return;dragged.style.position="fixed";dragged.style.left=e.clientX-dragOffsetX+"px";dragged.style.top=e.clientY-dragOffsetY+"px";document.querySelectorAll(".dropZone").forEach(z=>z.classList.remove("over"));const zone=getDropZoneAt(e.clientX,e.clientY);if(zone)zone.classList.add("over")}
function endDrag(e){if(!dragged)return;dragged.classList.remove("dragging");document.querySelectorAll(".dropZone").forEach(z=>z.classList.remove("over"));const zone=getDropZoneAt(e.clientX,e.clientY);if(zone){placeCard(zone,dragged);setFeedback("تم وضع البطاقة 👍","")}else{returnCard(dragged)}dragged.removeEventListener("pointermove",onDrag);dragged.removeEventListener("pointerup",endDrag);dragged.removeEventListener("pointercancel",endDrag);dragged=null}
function getDropZoneAt(x,y){let found=null;document.querySelectorAll(".dropZone").forEach(zone=>{const r=zone.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)found=zone});return found}
function placeCard(zone,card){card.dataset.placedIn=zone.dataset.group;card.classList.add("placed");card.style.position="relative";card.style.left="";card.style.top="";card.style.transform="";card.style.touchAction="auto";zone.appendChild(card)}
function returnCard(card){card.classList.remove("placed");card.dataset.placedIn="";$("cardsGrid").appendChild(card);card.style.position="absolute";card.style.left=card.dataset.originalLeft||"20px";card.style.top=card.dataset.originalTop||"20px";card.style.transform="";card.style.touchAction="none"}
function checkAnswers(){if(checked)return;checked=true;let correct=0;const cards=document.querySelectorAll(".card");cards.forEach(card=>{card.classList.remove("correctCard","wrongCard");if(card.dataset.group===card.dataset.placedIn){card.classList.add("correctCard");correct++}else{card.classList.add("wrongCard")}});const total=cards.length,percent=Math.round(correct/Math.max(1,total)*100);setFeedback(`أجبت ${correct} من ${total} بشكل صحيح ⭐ (${percent}%)`,correct===total?"correct":"wrong");setTimeout(()=>{$("doneTitle").textContent=correct===total?"أحسنت 🎉":`النتيجة: ${correct} / ${total} ⭐` ;$("doneOverlay").style.display="flex"},1100)}
async function init(){
  try{
    if(location.protocol === "http:" || location.protocol === "https:"){
      const res = await fetch("game.json?"+Date.now());
      if(!res.ok) throw new Error("game.json not found");
      GAME = await res.json();
    } else {
      GAME = JSON.parse(document.getElementById("embeddedGameJson").textContent);
    }
    renderGame();
  }catch(e){
    try{
      GAME = JSON.parse(document.getElementById("embeddedGameJson").textContent);
      renderGame();
      setFeedback("تم تشغيل نسخة مدمجة من بيانات اللعبة", "");
    }catch(err){
      $("title").textContent="لم يتم تحميل اللعبة";
      setFeedback("تأكد من وجود ملف game.json بجانب index.html", "wrong");
    }
  }
}
init();
</script>
</body>
</html>
